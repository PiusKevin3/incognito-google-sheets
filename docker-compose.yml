version: '3.8'

services:
  backend:
    build: .
    container_name: incognito-app
    ports:
      - "4000:4000"
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_HOST=db
      - PG_DATABASE=cognito_entries_db
      - PG_PORT=5432
      - PG_SSL=false
    command: npm start

  db:
    image: postgres:14
    container_name: incognito-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incognito_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
